include:
  - ./db.docker-compose.yml

services:
  app:
    image: node:24
    working_dir: /app/api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: dev
      POSTGRES_HOST: postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npm run start
      "
    depends_on:
      - postgres
