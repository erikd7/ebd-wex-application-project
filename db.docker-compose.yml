#Use this to run the DB locally with `docker compose up`

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-purchases}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data

volumes:
  db_volume:
